services:

  # ── Postgres 16 with all Augur extensions ────────────────────────────────────
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-augur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-augur}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose to localhost for direct inspection; remove in production
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-augur} -d ${POSTGRES_DB:-augur}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis — reserved for future Dramatiq task queue migration ────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Augur application ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-augur}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-augur}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set}
      OPENROUTER_FREE_TIER_API_KEY: ${OPENROUTER_FREE_TIER_API_KEY:?OPENROUTER_FREE_TIER_API_KEY must be set}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-augur-backups}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-eu-central}
      DAILY_LLM_BUDGET_USD: ${DAILY_LLM_BUDGET_USD:-5.00}
      # OpenRouter free tier: requests per account per day and minute
      LLM_DAILY_CALL_LIMIT: ${LLM_DAILY_CALL_LIMIT:-800}
      LLM_CALLS_PER_MINUTE: ${LLM_CALLS_PER_MINUTE:-12}
      EXTRACTION_CALLS_PER_RUN: ${EXTRACTION_CALLS_PER_RUN:-20}
      REJECTED_PAYLOAD_RETENTION_DAYS: ${REJECTED_PAYLOAD_RETENTION_DAYS:-30}
      # Historical backfill (`augur backfill run`), paid model within its own cap
      BACKFILL_MODEL: ${BACKFILL_MODEL:-inclusionai/ling-3.0-flash}
      BACKFILL_BUDGET_USD: ${BACKFILL_BUDGET_USD:-4}
      BACKFILL_REASONING_OFF: ${BACKFILL_REASONING_OFF:-true}
      BACKFILL_PER_DAY: ${BACKFILL_PER_DAY:-25}
      BACKFILL_PER_SOURCE_CAP: ${BACKFILL_PER_SOURCE_CAP:-8}
      # Empty = openrouter/free (see src/augur/llm/models.py)
      AUGUR_MODEL_EXTRACTION: ${AUGUR_MODEL_EXTRACTION:-}
      AUGUR_MODEL_ANCHORING: ${AUGUR_MODEL_ANCHORING:-}
      AUGUR_MODEL_DISCONFIRMATION: ${AUGUR_MODEL_DISCONFIRMATION:-}
      AUGUR_MODEL_PROJECTION: ${AUGUR_MODEL_PROJECTION:-}
      AUGUR_MODEL_CONVERSATION: ${AUGUR_MODEL_CONVERSATION:-}
      AUGUR_MODEL_DIGEST: ${AUGUR_MODEL_DIGEST:-}
      # Unset or empty = /api/* is open; set it once anything beyond the host can reach the API
      AUGUR_API_KEY: ${AUGUR_API_KEY:-}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      # The payloads volume below; the app default (/data/augur/payloads) is outside it
      PAYLOAD_ARCHIVE_ROOT: /app/payloads
      AUGUR_ENV: ${AUGUR_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - payloads:/app/payloads
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  payloads:
